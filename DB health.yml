info:
  name: DB health
  type: http
  seq: 2
http:
  method: GET
  url: '{{api}}/health/db'
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
- name: 200 - Database available
  request:
    method: GET
    url: '{{api}}/health/db'
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "status": "ok"
        }
- name: 503 - Database failure (simulated)
  request:
    method: GET
    url: '{{api}}/health/db'
  response:
    status: 503
    statusText: Service Unavailable
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "detail": "Database unavailable (simulated)"
        }
docs: |
  # DB health

  Saved examples contain actual responses captured with TestClient and an isolated PostgreSQL database. IDs and timestamps are illustrative; use the maitre-local environment variables for live requests.

  Documented HTTP statuses: 200, 503.

  Domain errors use `{ "code": "stable_error_code", "detail": "message" }`. Validation errors (422) retain the native FastAPI `detail` array.

  The 503 example uses an injected database failure. Its detail is illustrative: the current endpoint returns the exception text, without a domain code.
