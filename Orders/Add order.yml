- name: 409 - product_not_active
  request:
    method: POST
    url: '{{api}}/orders'
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "table_id": "916ce46a-fd23-4fa5-837d-936d2250151e",
          "items": [
            {
              "product_id": "96b1afb1-6c7d-4957-851b-5c273c0f5763",
              "quantity": 1
            }
          ]
        }
  response:
    status: 409
    statusText: Conflict
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "code": "product_not_active",
          "detail": "O produto não está ativo (96b1afb1-6c7d-4957-851b-5c273c0f5763)."
        }
- name: 409 - Table occupied
  request:
    method: POST
    url: '{{api}}/orders'
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "table_id": "916ce46a-fd23-4fa5-837d-936d2250151e",
          "items": [
            {
              "product_id": "f4eb300a-2679-49ce-b90e-df4b21c9c699",
              "quantity": 4
            }
          ]
        }
  response:
    status: 409
    statusText: Conflict
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "code": "table_not_available",
