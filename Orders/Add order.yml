info:
  name: Add order
  type: http
  seq: 1
http:
  method: POST
  url: '{{api}}/orders'
  body:
    type: json
    data: |-
      {
        "table_id": "{{table_id}}",
        "items": [
          {
            "product_id": "{{product_id}}",
            "quantity": 4
          }
        ]
      }
  auth: inherit
  headers:
  - name: Content-Type
    value: application/json
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
- name: 201 - Order opened
  request:
    method: POST
    url: '{{api}}/orders'
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "table_id": "916ce46a-fd23-4fa5-837d-936d2250151e",
          "items": [
            {
              "product_id": "f4eb300a-2679-49ce-b90e-df4b21c9c699",
              "quantity": 4
            }
          ]
        }
  response:
    status: 201
    statusText: Created
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "07c83ca3-e74d-42a4-94dd-df6398a62f64",
          "table_id": "916ce46a-fd23-4fa5-837d-936d2250151e",
          "table_number": 2,
          "status": "Aberto",
          "items": [
            {
              "id": "feaa0567-ecea-420d-9d9a-1f8a1e369054",
              "product_id": "f4eb300a-2679-49ce-b90e-df4b21c9c699",
              "product_name": "Snickers",
              "quantity": 4,
              "unit_price": "6.00",
              "created_at": "2026-10-24T20:32:17.544943Z",
              "updated_at": "2026-10-24T20:32:17.544943Z",
              "subtotal": "24.00"
            }
          ],
          "created_at": "2026-10-24T20:32:17.544943Z",
          "updated_at": "2026-10-24T20:32:17.544943Z"
        }
- name: 404 - Table not found
  request:
    method: POST
    url: '{{api}}/orders'
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "table_id": "00000000-0000-4000-8000-000000000000",
          "items": [
            {
              "product_id": "f4eb300a-2679-49ce-b90e-df4b21c9c699",
              "quantity": 4
            }
          ]
        }
  response:
    status: 404
    statusText: Not Found
    headers:
