info:
  name: Close order
  type: http
  seq: 4
http:
  method: POST
  url: '{{api}}/orders/:id/close'
  params:
  - name: id
    value: '{{order_id}}'
    type: path
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
