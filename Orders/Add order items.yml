info:
  name: Add order items
  type: http
  seq: 2
http:
  method: POST
  url: '{{api}}/orders/:id/items'
  params:
  - name: id
    value: '{{order_id}}'
    type: path
  body:
    type: json
    data: |-
      [
        {
          "product_id": "{{product_id}}",
          "quantity": 1
        }
      ]
  auth: inherit
  headers:
  - name: Content-Type
    value: application/json
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
