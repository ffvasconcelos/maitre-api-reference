info:
  name: Create product
  type: http
  seq: 1
http:
  method: POST
  url: '{{api}}/products'
  body:
    type: json
    data: |-
      {
        "name": "Snickers",
        "description": "Chocolate Snickers",
        "price": "6.00",
        "active": true
      }
  auth: inherit
  headers:
  - name: Content-Type
    value: application/json
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
- name: 201 - Product created
  request:
    method: POST
    url: '{{api}}/products'
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "name": "Snickers",
          "description": "Chocolate Snickers",
          "price": "6.00",
          "active": true
        }
  response:
    status: 201
    statusText: Created
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "f4eb300a-2679-49ce-b90e-df4b21c9c699",
          "name": "Snickers",
          "description": "Chocolate Snickers",
          "price": "6.00",
          "active": true,
          "created_at": "2026-10-24T20:32:17.512704Z",
          "updated_at": "2026-10-24T20:32:17.512704Z"
        }
- name: 422 - Invalid input
  request:
    method: POST
    url: '{{api}}/products'
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "name": "Snickers",
          "price": "6.001"
        }
  response:
    status: 422
    statusText: Unprocessable Entity
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "detail": [
            {
              "type": "decimal_max_places",
              "loc": [
                "body",
                "price"
              ],
              "msg": "Decimal input should have no more than 2 decimal places",
              "input": "6.001",
              "ctx": {
                "decimal_places": 2
              }
            }
          ]
        }
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201) {
        bru.setVar("product_id", res.body.id);
      }
docs: |
  # Create product

  Saved examples contain actual responses captured with TestClient and an isolated PostgreSQL database. IDs and timestamps are illustrative; use the maitre-local environment variables for live requests.

  Documented HTTP statuses: 201, 422.

  Domain errors use `{ "code": "stable_error_code", "detail": "message" }`. Validation errors (422) retain the native FastAPI `detail` array.
