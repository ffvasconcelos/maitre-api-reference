info:
  name: Create product
  type: http
  seq: 1

http:
  method: POST
  url: "{{api}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Prato feito",
        "description": "Prato feito montado pelo estabelecimento com a opção de carne do cliente",
        "price": "35.00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
