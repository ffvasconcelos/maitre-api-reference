info:
  name: Get by id
  type: http
  seq: 3
http:
  method: GET
  url: '{{api}}/tables/:id'
  params:
  - name: id
    value: '{{table_id}}'
    type: path
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
- name: 200 - Table found
  request:
    method: GET
    url: '{{api}}/tables/916ce46a-fd23-4fa5-837d-936d2250151e'
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "916ce46a-fd23-4fa5-837d-936d2250151e",
          "number": 2,
          "capacity": 4,
          "status": "disponível",
          "created_at": "2026-10-24T20:32:17.518524Z",
          "updated_at": "2026-10-24T20:32:17.518524Z"
        }
- name: 404 - Table not found
  request:
    method: GET
    url: '{{api}}/tables/00000000-0000-4000-8000-000000000000'
  response:
    status: 404
    statusText: Not Found
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "code": "table_not_found",
          "detail": "Mesa não encontrada (00000000-0000-4000-8000-000000000000)."
        }
- name: 422 - Invalid input
  request:
    method: GET
    url: '{{api}}/tables/invalid-uuid'
  response:
    status: 422
    statusText: Unprocessable Entity
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "detail": [
            {
              "type": "uuid_parsing",
              "loc": [
                "path",
                "table_id"
              ],
              "msg": "Input should be a valid UUID, invalid character: found `i` at 1",
              "input": "invalid-uuid",
              "ctx": {
                "error": "invalid character: found `i` at 1"
              }
            }
          ]
        }
docs: |
  # Get by id

  Saved examples contain actual responses captured with TestClient and an isolated PostgreSQL database. IDs and timestamps are illustrative; use the maitre-local environment variables for live requests.

  Documented HTTP statuses: 200, 404, 422.

  Domain errors use `{ "code": "stable_error_code", "detail": "message" }`. Validation errors (422) retain the native FastAPI `detail` array.
